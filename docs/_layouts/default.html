<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}: {{ page.subtitle }}</title>
<meta name="description" content="{{ page.description }}">
<meta property="og:title" content="{{ page.title }}: {{ page.subtitle }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/fig1.png">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1c1f;
    --muted: #5c6470;
    --rule: #e3e6ea;
    --accent: #1e6bb8;
    --card: #f7f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --muted: #a2abb8;
      --rule: #2a2e35;
      --accent: #6fb3f2;
      --card: #1c1f25;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 56px 24px 72px; }
  header { text-align: center; border-bottom: 1px solid var(--rule); padding-bottom: 32px; }
  h1 { font-size: 32px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -0.01em; }
  h1 .sub { display: block; font-size: 21px; font-weight: 500; color: var(--muted); margin-top: 8px; }
  .authors { margin: 18px 0 4px; font-size: 17px; }
  .affil, .venue { color: var(--muted); font-size: 15px; margin: 4px 0; }
  .venue strong { color: var(--fg); font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px; }
  .btn {
    display: inline-block; padding: 9px 18px; border-radius: 999px;
    border: 1px solid var(--rule); background: var(--card);
    color: var(--fg); text-decoration: none; font-size: 15px; font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  h2 { font-size: 20px; margin: 44px 0 14px; letter-spacing: -0.01em; }
  p { margin: 0 0 16px; }
  a { color: var(--accent); }
  /* a bare image in the content is a figure */
  .content p > img {
    width: 100%; height: auto; display: block; margin-top: 32px;
    border: 1px solid var(--rule); border-radius: 8px; background: #fff;
  }
  /* paragraph tagged {: .caption} in index.md */
  .caption { color: var(--muted); font-size: 14.5px; line-height: 1.55; margin-top: 10px; }
  .caption strong { color: var(--fg); }
  .note {
    background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 12px 16px; font-size: 14.5px; color: var(--muted); margin: 24px 0 0;
  }
  .note strong { color: var(--fg); }
  pre {
    background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  pre > code { background: none; padding: 0; }
  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--rule);
           color: var(--muted); font-size: 14px; text-align: center; }
  @media (max-width: 600px) {
    .wrap { padding: 36px 18px 56px; }
    h1 { font-size: 26px; }
    h1 .sub { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>{{ page.title }}
    <span class="sub">{{ page.subtitle }}</span>
  </h1>
  <p class="authors">{{ page.authors }}</p>
  <p class="affil">{{ page.affiliation }}</p>
  <p class="venue"><strong>{{ page.venue }}</strong>{{ page.venue_note }}</p>
  <nav class="links">
    {% for link in page.links %}
    <a class="btn" href="{{ link.url }}">{{ link.text }}</a>
    {% endfor %}
  </nav>
</header>

<div class="content">
{{ content }}
</div>

<footer>{{ page.footer }}</footer>

</div>
</body>
</html>
